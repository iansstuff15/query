# DynamoDB Local — endpoint http://localhost:18000, region us-east-1, any access key / secret
name: query-dynamodb
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["18000:8000"]
  seed:
    image: amazon/aws-cli:latest
    depends_on: [dynamodb]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    volumes: [".:/seed:ro"]
    entrypoint:
      - sh
      - -c
      - |
        set -e
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done
        for table in customers products orders; do
          aws dynamodb create-table --endpoint-url http://dynamodb:8000 --table-name $$table \
            --attribute-definitions AttributeName=id,AttributeType=N --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST >/dev/null
          aws dynamodb batch-write-item --endpoint-url http://dynamodb:8000 --request-items file:///seed/$$table.json >/dev/null
        done
        echo seeded
    restart: "no"
