# Elasticsearch 8.15 (security on, HTTP) — http://query_reader:ReaderPass1@localhost:19200
name: query-elasticsearch
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: AdminPass1
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["19200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:AdminPass1 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"]
      interval: 3s
      retries: 60
  seed:
    image: python:3.12-alpine
    depends_on:
      elasticsearch: { condition: service_healthy }
    volumes: [".:/seed:ro", "../tools/elasticsearch_seed.py:/elasticsearch_seed.py:ro"]
    entrypoint: ["python3", "/elasticsearch_seed.py", "http://elasticsearch:9200", "elastic", "AdminPass1", "/seed"]
    restart: "no"
