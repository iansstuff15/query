# MySQL 8.4 — mysql://query_reader:ReaderPass1@localhost:33306/app
name: query-mysql
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: AdminPass1
      TZ: UTC
    ports: ["33306:3306"]
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pAdminPass1"]
      interval: 3s
      retries: 40
