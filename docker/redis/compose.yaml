# Valkey 8 (Redis-compatible) — redis://query_reader:ReaderPass1@localhost:16379/0
name: query-redis
services:
  redis:
    image: valkey/valkey:8
    command: ["valkey-server", "--requirepass", "AdminPass1"]
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "AdminPass1", "ping"]
      interval: 2s
      retries: 30
  seed:
    image: valkey/valkey:8
    depends_on:
      redis: { condition: service_healthy }
    volumes: ["./seed.redis:/seed.redis:ro"]
    entrypoint: ["sh", "-c", "grep -v '^#' /seed.redis | valkey-cli -h redis -a AdminPass1 --no-auth-warning"]
    restart: "no"
